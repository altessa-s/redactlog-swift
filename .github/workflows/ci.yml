# What has to be true of every push and every pull request.
#
# What this package has to get right is mostly what must *not* happen, and none
# of it can be checked by reading the code: that a token never reaches a line,
# that a value nobody classified comes out redacted rather than printed, that a
# rotation puts a file aside instead of losing it, that a level nobody listens to
# costs nothing. Each one is answered by giving the facade a recording sink and
# asking what it received. They are also the tests that stop being true quietly —
# a forgotten tag still compiles and still logs, just with somebody's secret in
# it — so they run on every push.
#
# macOS also checks Apple's unified log sink. Its
# Xcode is chosen rather than pinned — `Package.swift` asks for tools 6.3, and a
# runner image pinned to an older Xcode fails to parse the manifest at all, with
# an error that reads like a syntax error and is not one.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege, named rather than inherited: these jobs read the tree and
# write nothing, and the default token would let them do more.
permissions:
  contents: read

# Actions are pinned to a major tag: patches and security fixes arrive without
# a commit here, and a major bump — which is the one that can break a build —
# still has to be made on purpose. A repository that wants the stricter form
# pins the full commit SHA instead, and then needs something like Dependabot to
# move it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode on the runner
        run: Scripts/ci-select-xcode.sh
      - run: swift build --build-tests
      - run: swift test

  # The toolchain comes from the image rather than from an installer action:
  # `swift-actions/setup-swift` answered "Version 6.3 is not available" for
  # every spelling of the version we ship against, while `swift:6.3` is the
  # image the port was actually verified in. Same compiler, same words.
  #
  # Windows is not in the matrix: there is no image to pull, and the toolchain
  # installer could not resolve a version either. It is verified by hand in a
  # Windows VM; when a working installer is chosen, it joins the matrix here.
  linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      # Not root, because two tests refuse a write by relying on the disk
      # refusing it, and root is never refused. Everything below runs as that
      # user: a `.build` made by root first is a directory the tests cannot
      # write to, and the workspace itself lives under a root-owned parent.
      - run: |
          useradd -m builder
          chown -R builder "$(cd .. && pwd)"
          su builder -c "cd '$GITHUB_WORKSPACE' && swift build && swift test"

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # A release pinned by number rather than whatever Homebrew has today:
      # `--strict` below turns every new rule a new SwiftLint ships into a red
      # build, and a build that goes red without a commit is a build nobody
      # can bisect. Bumping the number is a commit, reviewed like one.
      - name: Install SwiftLint 0.65.1
        run: |
          curl -sSL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q swiftlint.zip -d swiftlint-bin
      # `--strict` because the configuration beside it has no warnings left to
      # tolerate: every rule that fires on deliberate work is switched off by
      # name, with the measurement that justified it. A warning here is new.
      - run: swiftlint-bin/swiftlint lint --strict

  framework:
    name: Build the xcframework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode on the runner
        run: Scripts/ci-select-xcode.sh
      - run: brew install xcodegen
      # The artefact a consumer links against, built the way a release is: the
      # script's own checks refuse a static framework and one missing a slice,
      # and both are failures that otherwise surface only in the consumer. No
      # credentials and no network — the Apple framework uses system modules.
      - run: Scripts/build-xcframework.sh
